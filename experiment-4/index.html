<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp-4</title>
</head>
<body>
    <form align="center" action="#" method="post"> 
    <h1><b>Hotel Room Booking Form</b></h1>
    
        <label for="name"><b>Full Name:</b></label>
        <input type="text" id="name" required>
        <br><br>
        <label for="email"><b>Email:</b></label>
        <input type="email" id="email" required>
        <br><br> 
        <label for="number"><b>Contact Number:</b></label>
        <input type="tel" id="number" required>  
        <br><br>
        <label for="check_in"><b>Check-in Date:</b></label>
        <input type="date" id="check_in" required> 
        <br><br>
        <label for="check_out"><b>Check-out Date:</b></label>
        <input type="date" id="check_out" required> 
        <br><br>
        <label for="room_type"><b>Room Type:</b></label>
        <select id="room_type">
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="suite">Suite</option>
        </select>
        <br><br>
        <label for="guests"><b>Number of Guests:</b></label>
        <input type="number" id="guests" min="1" max="10" required>
        <br><br>
        <label for="special_requests"><b>Special Requests:</b></label>
        <input type="text" id="special_requests" >
        <br><br>
        <input type="submit" value="Book Room">
        <br><br>
    </form>
</body>
