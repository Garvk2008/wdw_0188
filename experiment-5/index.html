<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 align="center"><b>Student Registration Form</b></h1>    
<form>
    <p>
        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your full name" required>
    </p>
    <p>
        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
    </p>
    <p>                         
        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter your password" required>
    </p>        
    <p>    <label>Gender:</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
    </p>
    <p>
        <label>Course:</label>
        <select name="course" required>
            <option value="">Select Course</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
        </select>   
    </p>
    <p>
        <label>Contact Number:</label>
        <input type="tel" name="contact" placeholder="Enter your contact number" required>
    </p>
    <!--Address(Text Area)-->
    <p>
        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="50" placeholder="Enter your address" required></textarea>
    </p>

    <!--Submit and Reset-->
    <p>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </p>

</form>
 
 <hr>
  <p align="center">&copy; 2025 Student Registration Portal.</p>
</body>
</html>
